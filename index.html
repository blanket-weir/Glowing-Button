<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glowing Button</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<button class="btn">Hover Me</button>
    <style>
        html, body{
    margin: 0;
    width: 100%;
    height: 100vh;

    cursor: url("img_2 (2).png") 0 0, auto;
    min-height: 100vh;
    min-width: 100vw;

    display: flex;
    justify-content: center;
    align-items: center;

    background-color: #161616;
    overflow: hidden;
}

.btn{
    padding: 15px 40px;
    border: none;
    outline: none;
    color: #FFF;
    cursor: url("3bb34a5f-a6c7-42aa-8fb9-3a5bfed96c40.png") 0 0, auto;
    font-size: 1.5em;
    position: relative;
    z-index: 0;
    border-radius: 15px;
}

.btn::after{
    content: "";
    position: absolute;
    z-index: -1;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    background: #333;
    border-radius: 12px;
}
.btn::before{
    content: "";
    background: linear-gradient(
    45deg,
    #FF0000, #FF7300, #FFFB00, #48FF00,
    #00FFD5, #002BFF, #FF00C8, #FF0000
    );
    position: absolute;
    top: -2px;
    left: -2px;
    background-size: 600%;
    z-index: -1;
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    filter: blur(8px);
    animation: glowing 20s linear infinite;
    transition: opacity .3s ease-in-out;
    border-radius: 10px;
    opacity: 0;
}
@keyframes glowing{
    0% {background-position: 0 0;}
    50% {background-position: 400% 0;}
    100% {background-position: 0 0;}
}
.btn:hover::before{
    opacity: 1;
}
.btn:active:after{
     background: transparent;
     cursor: url("img_2 (2).png") 0 0, auto;
}
.btn:active {
    color: #000;
    font-weight: bold;
}
    </style>
</body>
</html>
